[tool.poetry]
name = "geowizard"
version = "0.1.0"
description = "GeoWizard: Unleashing the Diffusion Priors for 3D Geometry Estimation from a Single Image"
authors = ["GeoWizard Team"]
readme = "README.md"
packages = [{include = "geowizard"}]

[tool.poetry.dependencies]
python = "^3.8"
torch = "2.0.1"
torchvision = "0.15.2"
xformers = "0.0.21"
diffusers = "0.25.0"
huggingface-hub = "0.21.3"
opencv-python = "*"
numpy = "1.23.1"
Pillow = "*"
h5py = "*"
matplotlib = "3.7.5"
scikit-image = "0.18.1"
gradio = "4.11.0"
gradio-imageslider = "0.0.16"
trimesh = "4.0.5"
tqdm = "4.65.0"
accelerate = "0.28.0"
transformers = "4.39.1"
imgaug = "*"
GitPython = "3.1.40"
pygltflib = "1.16.1"
pyvista = "0.37.0"
fire = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=geowizard",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",  # Set to 0 for initial setup, increase as tests are added
    "-vv",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["geowizard"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/distutils/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/.env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "pass",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"